server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: bazarali-daulet-student-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentdb}
    username: ${SPRING_DATASOURCE_USERNAME:studentapp}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
