name: bazarali-daulet-student-api
services:
  db:
    image: postgres:16-alpine
    container_name: bazarali-daulet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: studentapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - student-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentapp -d studentdb"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    image: bazarali-daulet-student-api:v1.0-37392
    container_name: bazarali-daulet-student-api
    restart: unless-stopped
    ports:
      - "8092:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studentdb
      SPRING_DATASOURCE_USERNAME: studentapp
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - student-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
volumes:
  postgres_data:
networks:
  student-network:
    driver: bridge
